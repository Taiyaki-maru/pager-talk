version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pagertalk?schema=public
      - SESSION_SECRET=super_secret_key_dev
      - NODE_ENV=development
    depends_on:
      - db
    command: yarn dev

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagertalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: